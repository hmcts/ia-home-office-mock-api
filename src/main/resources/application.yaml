server:
  port: 8098

management:
  endpoint:
    health:
      show-details: "always"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus, mappings

spring:
  application:
    name: IA Home Office Mock API
  config:
    import: "optional:configtree:/mnt/secrets/ia/"

springdoc:
  swagger-ui:
    url: /openapi.yaml

getApplication:
  delay: ${IA_HOMEOFFICE_DELAY:0}
